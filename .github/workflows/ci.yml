name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Install browser for UI tests
        run: npx playwright install chromium

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test frontend keyboard handling
        run: npm test

      - name: Test browser interactions and accessibility
        run: npm run test:browser

      - name: Build frontend
        run: npm run build

  fedora:
    name: Fedora 45 checks
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Fedora build dependencies
        run: >
          dnf install -y git gcc gcc-c++ make curl wget file pkgconf-pkg-config
          webkit2gtk4.1-devel gtk3-devel openssl-devel libappindicator-gtk3-devel
          librsvg2-devel libxdo-devel dbus-devel rpm-build
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm test
      - run: npm run build
